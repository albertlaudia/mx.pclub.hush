name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (for Flutter Android tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Bumped from 3.27.0 to 3.32.0 (Dart 3.8) so the CI can
          # resolve the latest deps (flutter_lints 6.x, google_fonts 8.x,
          # flutter_riverpod 3.x) which all require Dart ^3.7.0 or newer.
          # See commit "Fix CI: bump Flutter to 3.32.0".
          flutter-version: '3.32.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation is up to date (no codegen for now)
        run: echo "skip — no codegen in v0.1"

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit + widget tests
        run: flutter test --coverage

      - name: Verify build (Android debug)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
