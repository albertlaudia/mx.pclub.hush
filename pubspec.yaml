name: hush
description: "hush. — a daily practice, quietly. Minimal v0.2: 3 screens, local-only, no backend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage (no backend in v0.1)
  shared_preferences: ^2.3.2

  # Fonts
  google_fonts: ^6.2.1

  # Date / locale
  intl: ^0.20.2

  # Open external URLs (mailto: for feedback, https: for privacy policy).
  # Local-only data; no tracking.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/verses/
