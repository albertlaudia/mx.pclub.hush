name: hush
description: "hush. — a daily practice, quietly. Minimal v0.4: 3 screens, local-only, no backend, opt-in daily notification."
publish_to: 'none'
version: 0.4.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Local storage (no backend in v0.1)
  shared_preferences: ^2.3.2

  # Fonts
  # Pinned to ^6.2.1 because google_fonts 8.x requires Dart ^3.10.0
  # and the CI is on Flutter 3.27.0 (Dart 3.6.0). When the CI
  # Flutter is bumped to 3.32+, this can be relaxed to ^8.0.0.
  google_fonts: ^6.2.1

  # Date / locale
  intl: ^0.20.2

  # Open external URLs (mailto: for feedback, https: for privacy policy).
  # Local-only data; no tracking.
  url_launcher: ^6.3.0

  # Local daily notification (opt-in, brand-aligned copy). The
  # notification is the single highest-leverage addition to make
  # hush. findable without abandoning the philosophy.
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_lints 6.0.0 requires Dart ^3.8.0. The CI is on Flutter
  # 3.32.0 (Dart 3.8) after the v0.4.1 CI bump. We can use 6.0.0
  # here, but keep 5.0.0 to be conservative — no compelling reason
  # to upgrade until we need a new lint.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/verses/
