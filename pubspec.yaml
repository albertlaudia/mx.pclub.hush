name: lock
description: "Prayer Lock — basic MVP. App block + prayer screen, day streak, home widget, daily check-in. Local-only, no backend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage (no backend in this MVP)
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Home screen widget (iOS + Android)
  home_widget: ^0.6.0

  # Fonts
  google_fonts: ^6.2.1

  # Date / locale
  intl: ^0.19.0

  # Icons (Material symbols, light weight)
  material_symbols_icons: ^4.2825.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/verses/
